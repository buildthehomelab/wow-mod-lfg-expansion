name: core-build
on:
  push:
    branches:
      - 'master'
      - 'main'
  pull_request:
    branches:
      - 'master'
      - 'main'
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older run still queued or running
concurrency:
  group: core-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: azerothcore/reusable-workflows/.github/workflows/core_build_modules.yml@main
    with:
      module_repo: mod-lfg-expansion   # the module folder is mod-lfg-expansion; the repo name carries a wow- prefix
